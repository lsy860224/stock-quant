[project]
name = "stock-quant"
version = "0.0.1"
description = "Polymarket 자율 트레이딩 에이전트 (LLM 공정가치 → Kelly → CLOB). 보고서 §4.1 경로 A."
readme = "README.md"
requires-python = ">=3.9.10"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "schedule>=1.2",
    "python-dotenv>=1.0",
]

# 라이브 주문 경로는 명시적 설치로만 활성화: uv sync --extra live
[project.optional-dependencies]
live = [
    "py-clob-client>=0.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
stock-quant = "stock_quant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_quant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["py_clob_client.*"]
ignore_missing_imports = true
